<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;width:700px;height:180px;background:var(--cream-50);font-family:var(--p-family);color:var(--fg);}
  .wrap{padding:20px;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:12px;align-items:stretch}
  .swatch{flex:1;min-width:0;border-radius:8px;overflow:hidden;border:1px solid var(--border-quiet);display:flex;flex-direction:column}
  .swatch .top{flex:1;min-height:72px}
  .swatch .meta{padding:8px 10px;background:var(--white);font-size:12px;line-height:1.3;color:var(--fg-strong)}
  .swatch .meta b{display:block;font-family:var(--p-family);font-weight:500;letter-spacing:-0.02em;color:var(--fg-strong);font-size:13px}
  .swatch .meta span{display:block;color:var(--fg-muted);font-size:11px;font-variant-numeric:tabular-nums;margin-top:2px}
  .token{font-family:ui-monospace,Menlo,monospace}
  .label{font-family:var(--p-family);font-size:12px;color:var(--fg-muted);letter-spacing:0}
</style></head><body><div class="wrap">
<div class="row" style="flex:1">
  <div class="swatch"><div class="top" style="background:#040504"></div><div class="meta" style="background:#040504;color:#FFFCF7"><b>Grey 900</b><span class="token">#040504 · body</span></div></div>
  <div class="swatch"><div class="top" style="background:#252525"></div><div class="meta" style="background:#252525;color:#FFFCF7"><b>Grey 800</b><span class="token">#252525 · headings</span></div></div>
  <div class="swatch"><div class="top" style="background:#76736D"></div><div class="meta" style="background:#76736D;color:#FFFCF7"><b>Grey 500</b><span class="token">#76736D · muted / placeholder</span></div></div>
  <div class="swatch"><div class="top" style="background:#DDDCDB"></div><div class="meta"><b>Grey 300</b><span class="token">#DDDCDB · hairline</span></div></div>
</div></div></body></html>
