<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;width:700px;height:280px;background:var(--cream-50);font-family:var(--p-family);color:var(--fg);}
  .wrap{padding:20px;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:12px;align-items:stretch}
  .swatch{flex:1;min-width:0;border-radius:8px;overflow:hidden;border:1px solid var(--border-quiet);display:flex;flex-direction:column}
  .swatch .top{flex:1;min-height:72px}
  .swatch .meta{padding:8px 10px;background:var(--white);font-size:12px;line-height:1.3;color:var(--fg-strong)}
  .swatch .meta b{display:block;font-family:var(--p-family);font-weight:500;letter-spacing:-0.02em;color:var(--fg-strong);font-size:13px}
  .swatch .meta span{display:block;color:var(--fg-muted);font-size:11px;font-variant-numeric:tabular-nums;margin-top:2px}
  .token{font-family:ui-monospace,Menlo,monospace}
  .label{font-family:var(--p-family);font-size:12px;color:var(--fg-muted);letter-spacing:0}
</style></head><body><div class="wrap">
<div class="label">Semantic mapping — how base tokens land on real elements</div>
<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="background:#FFFCF7;border:1px solid #DDDCDB;padding:10px 12px;border-radius:6px"><b>--bg</b> <span class="token" style="color:#76736D;float:right">Cream 50</span></div>
    <div style="background:#2C4E25;color:#FFFCF7;padding:10px 12px;border-radius:6px"><b>--bg-inverse</b> <span class="token" style="opacity:.7;float:right">Forest 700</span></div>
    <div style="background:#182E6C;color:#FFFCF7;padding:10px 12px;border-radius:6px"><b>--bg-app-header</b> <span class="token" style="opacity:.7;float:right">Navy 900</span></div>
    <div style="background:#FFFFFF;border:1px solid #DDDCDB;padding:10px 12px;border-radius:6px"><b>--bg-alt</b> <span class="token" style="color:#76736D;float:right">White</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="background:#FFFCF7;border:1px solid #DDDCDB;padding:10px 12px;border-radius:6px;color:#040504"><b>--fg</b> <span class="token" style="color:#76736D;float:right">Grey 900</span></div>
    <div style="background:#FFFCF7;border:1px solid #DDDCDB;padding:10px 12px;border-radius:6px;color:#76736D"><b>--fg-muted</b> <span class="token" style="float:right">Grey 500</span></div>
    <div style="background:#FFFCF7;border:1px solid #DDDCDB;padding:10px 12px;border-radius:6px;color:#2C4E25"><b>--fg-brand</b> <span class="token" style="color:#76736D;float:right">Forest 700</span></div>
    <div style="background:#FFFCF7;border:1px solid #DDDCDB;padding:10px 12px;border-radius:6px;color:#182E6C"><b>--fg-app</b> <span class="token" style="color:#76736D;float:right">Navy 900</span></div>
  </div>
</div></div></body></html>
